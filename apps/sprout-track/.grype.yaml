# Grype ignore list for sprout-track.
# These specific High-severity findings are inherited from the upstream
# sprouttrack/sprout-track application's npm dependencies (copied verbatim into
# the image). The Wolfi base image is clean at High/Critical. They are accepted
# and documented in apps/sprout-track/SECURITY.md. Each entry is scoped to a
# specific vulnerability ID, so the build STILL fails on any NEW high/critical
# finding (e.g. in the base image or a new dependency).
