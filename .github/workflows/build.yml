name: build

on:
  push:
    branches: [master]
    paths:
      - "apps/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "apps/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.set.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: shell
          filters: |
            infra:
              - '.github/workflows/build.yml'
            apps:
              - 'apps/**'
      - id: set
        run: |
          # Rebuild every app when the build process itself changed, or on manual dispatch.
          if [ "${{ steps.filter.outputs.infra }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            apps=$(ls -d apps/*/ 2>/dev/null | xargs -n1 basename | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            # Build only the apps whose files actually changed.
            apps=$(echo '${{ steps.filter.outputs.apps_files }}' \
              | tr ' ' '\n' | grep '^apps/[^/]*/' | cut -d/ -f2 \
              | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  scan:
    name: scan ${{ matrix.app }}
    needs: discover
    if: ${{ needs.discover.outputs.apps != '[]' && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Compute image name
        id: image
        run: |
          echo "base=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/${{ matrix.app }}/Dockerfile

      # Build single-arch locally (not pushed) so the image exists for scanning.
      # Publishing happens ONLY in the `publish` job, which depends on this job
      # passing — including the Grype gate. Nothing is published from here.
      # Build is driven by the app's docker-bake.hcl so VERSION (the single
      # source of truth in that file) and the Dockerfile stay in lockstep.
      - name: Build (local, for scan, via bake)
        uses: docker/bake-action@v7
        with:
          source: apps/${{ matrix.app }}
          files: docker-bake.hcl
          targets: image-local
          load: true
          set: |
            *.platform=linux/amd64
            image-local.tags=${{ steps.image.outputs.base }}:ci-${{ github.sha }}

      - name: Locate Grype config
        id: grypecfg
        run: |
          f="apps/${{ matrix.app }}/.grype.yaml"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; else echo "path=" >> "$GITHUB_OUTPUT"; fi

      - name: Grype scan
        id: grype
        uses: anchore/scan-action@v7
        with:
          grype-version: "v0.114.0"
          config: ${{ steps.grypecfg.outputs.path }}
          image: ${{ steps.image.outputs.base }}:ci-${{ github.sha }}
          severity-cutoff: high
          # Push to the default branch fails the build on high+ vulns; PRs report only.
          fail-build: ${{ github.event_name != 'pull_request' }}
          output-format: table
          output-file: grype-${{ matrix.app }}.txt

      - name: Show Grype results in job log
        if: always()
        run: cat grype-${{ matrix.app }}.txt

      - name: Sync SECURITY.md from .grype.yaml
        run: |
          app="apps/${{ matrix.app }}"
          if [ -f "$app/.grype.yaml" ] && [ -f "$app/SECURITY.md.tmpl" ]; then
            python3 scripts/gen-security-md.py "$app"
            if [ -n "$(git status --porcelain "$app/SECURITY.md")" ]; then
              if [ "${{ github.event_name }}" = "pull_request" ]; then
                echo "::error::SECURITY.md is out of date with .grype.yaml. Run: python3 scripts/gen-security-md.py $app"
                git --no-pager diff "$app/SECURITY.md"
                exit 1
              else
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git add "$app/SECURITY.md"
                git commit -m "docs(${{ matrix.app }}): sync SECURITY.md from .grype.yaml [skip ci]"
                git push
              fi
            else
              echo "SECURITY.md up to date"
            fi
          else
            echo "No .grype.yaml/SECURITY.md.tmpl for $app; skipping sync"
          fi

      - name: Upload Grype report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: grype-${{ matrix.app }}
          path: grype-${{ matrix.app }}.txt
          if-no-files-found: warn

      - name: Comment Grype results on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('grype-${{ matrix.app }}.txt', 'utf8');
            const body = [
              '### 🔍 Grype vulnerability scan — `${{ matrix.app }}`',
              '',
              '_Note: this scans the image built from this PR (linux/amd64), not the deployed `:latest`._',
              '',
              '<details><summary>Results (severity ≥ high)</summary>',
              '',
              '```',
              report,
              '```',
              '',
              '</details>'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  publish:
    name: publish ${{ matrix.app }}
    needs: [discover, scan]
    if: ${{ github.event_name != 'pull_request' && needs.discover.outputs.apps != '[]' && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: |
          echo "base=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      - name: Extract app version
        id: appver
        run: |
          app="apps/${{ matrix.app }}"
          # Single source of truth for the version now lives in docker-bake.hcl.
          ver=$(awk '
            /^[[:space:]]*variable[[:space:]]+"VERSION"/ { inv=1 }
            inv && /default/ {
              line=$0
              sub(/.*default[[:space:]]*=[[:space:]]*/, "", line)
              gsub(/[ "]/, "", line)
              print line
              exit
            }
          ' "$app/docker-bake.hcl")
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "App version: ${ver:-<none>}"

      - name: Extract package description from app README
        id: desc
        run: |
          readme="apps/${{ matrix.app }}/README.md"
          if [ -f "$readme" ]; then
            desc=$(python3 -c "import re,pathlib;t=pathlib.Path('$readme').read_text();t=re.sub(r'^#\s+.*\n','',t);paras=[re.sub(r'\s+',' ',p).strip() for p in t.split('\n\n') if p.strip()];print(paras[0][:200] if paras else '')")
          else
            desc=""
          fi
          echo "description=$desc" >> "$GITHUB_OUTPUT"
          echo "Description: $desc"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.base }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.appver.outputs.version }},enable=${{ steps.appver.outputs.version != '' }}
          labels: |
            org.opencontainers.image.description=${{ steps.desc.outputs.description }}

      - name: Build and push (multi-arch, via bake)
        uses: docker/bake-action@v7
        with:
          source: apps/${{ matrix.app }}
          files: |
            docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
          targets: image-all
          push: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
