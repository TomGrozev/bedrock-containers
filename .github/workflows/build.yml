name: build

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'apps/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.set.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          apps=$(ls -d apps/*/ 2>/dev/null | xargs -n1 basename | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.app }}
    needs: discover
    if: ${{ needs.discover.outputs.apps != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=date,pattern='YYYYMMDD'

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/${{ matrix.app }}/Dockerfile

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Grype scan
        if: github.event_name != 'pull_request'
        uses: anchore/scan-action@v2
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}:latest
          severity-cutoff: high
          fail-build: true

      - name: Make package public
        if: github.event_name != 'pull_request'
        run: |
          gh api -X PUT "/user/packages/container/${{ matrix.app }}/visibility" -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
