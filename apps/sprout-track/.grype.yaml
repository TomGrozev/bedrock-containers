# Grype ignore list for sprout-track.
# Almost all accepted High-severity findings are inherited from the upstream
# sprouttrack/sprout-track application's npm dependencies (copied verbatim into
# the image). The single exception (CVE-2026-82209) is a Wolfi base curl finding
# accepted as a scanner false positive: the fix shipped IN curl 8.22.0, the exact
# version in the image. All entries are accepted and documented in
# apps/sprout-track/SECURITY.md, and each is scoped to a specific vulnerability
# ID, so the build STILL fails on any NEW high/critical finding (e.g. in the
# base image or a new dependency).
