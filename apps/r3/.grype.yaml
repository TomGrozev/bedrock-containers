# Grype ignore list for r3.
#
# This is the SINGLE SOURCE OF TRUTH for vulnerabilities that are intentionally
# "accepted" in this image — typically ones inherited from the upstream
# application layer (copied verbatim from the upstream image) that cannot be
# patched here without forking/rebuilding the app. CI regenerates
# apps/r3/SECURITY.md from this file on every run; never edit SECURITY.md by hand.
#
# Add an entry per accepted vulnerability, by its exact ID (GHSA or CVE), with a
# short reason:
#
#   - vulnerability: GHSA-xxxx-xxxx-xxxx
#     reason: "Accepted upstream hyperlogue/r3 vuln; see apps/r3/SECURITY.md"
#   - vulnerability: CVE-2026-xxxxx
#     reason: "Accepted upstream hyperlogue/r3 vuln; see apps/r3/SECURITY.md"
#
# Keep each entry scoped to a SPECIFIC vulnerability ID so the build still fails
# on any NEW high/critical finding (e.g. in the Wolfi base or a new dependency).
ignore:
  # glibc LANGUAGE path traversal. CVE fix not yet built by Wolfi/Chainguard:
  # the package index still tops out below the installed 2.44-r13, and the
  # Wolfi advisory has no fixed-version entry. Revisit when a patched glibc ships.
  - vulnerability: CVE-2026-84243
    reason: "No patched Wolfi glibc build yet (2.44-r13 installed, 2026-11-05). Exploitable only when an attacker controls LANGUAGE and LC_MESSAGES and can place a crafted .mo file readably; this image sets no LANGUAGE/LANG/LC_ALL and runs non-root with a read-only rootfs."
